<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 加入手機主畫面後，像 App 一樣全螢幕開啟 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="台灣旅行">
    <meta name="application-name" content="台灣旅行手帳">
    <meta name="theme-color" content="#F4F6F8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>台灣旅行手帳</title>
    
    <!-- 載入核心套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <!-- 圖示與字體 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <!-- 拖曳排序套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <!-- 圓餅圖套件 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 開源地圖 Leaflet 套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>if (typeof L === 'undefined') document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#E2E8F0', DEFAULT: '#7E93A3', dark: '#5A7184' },
                        spot: { food: '#87ceeb', spot: '#256694', transit: '#6E99B5', hotel: '#1A7DA1', shopping: '#8ABAD4' },
                        paper: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"M PLUS Rounded 1c"', 'sans-serif'],
                        serif: ['"Playfair Display"', '"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
        body { background-color: #E2E8F0; -webkit-tap-highlight-color: transparent; }
        /* 手機：整個背景與 App 同色，上方狀態列區域不會出現一條色差 */
        @media (max-width: 500px) {
            html, body { background-color: #F4F6F8; }
            .app-container { box-shadow: none !important; }
        }
        /* 點兩下不放大 */
        button, a, label, input, select, textarea, .draggable-card { touch-action: manipulation; }

        /* 自訂日期欄位（覆蓋原生日期輸入，iPhone 上不會跑版） */
        .date-field { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; overflow: hidden; }
        .date-field input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; -webkit-appearance: none; appearance: none; cursor: pointer; font-size: 16px; }

        #app .todo-item:last-child { border-bottom-color: #F1F5F9; }

        /* 現在時間紅點 */
        @keyframes now-pulse { 0% { box-shadow: 0 0 0 0 rgba(158,14,38,.45); } 70% { box-shadow: 0 0 0 6px rgba(158,14,38,0); } 100% { box-shadow: 0 0 0 0 rgba(158,14,38,0); } }
        .now-pulse { animation: now-pulse 2s infinite; }

        /* 置中彈出視窗 */
        @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-pop-in { animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .app-container { max-width: 430px; margin: 0 auto; background-color: #F4F6F8; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow-x: hidden; }
        /* 用「實際可見高度」，避免 iPhone 上最下面被切到、滑到底卡住 */
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        .app-container.h-screen { height: 100vh; height: 100dvh; }
        #main-scroll { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        [class~="overflow-y-auto"] { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .glass-header { background: rgba(244, 246, 248, 0.98); border-bottom: 1px solid rgba(0,0,0,0.05); transform: translateZ(0); }
        .glass-nav { background: rgba(255, 255, 255, 0.98); border-top: 1px solid #E2E8F0; transform: translateZ(0); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tag-outline { color: #64748B; background-color: transparent; border: 1px solid #CBD5E1; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; margin: 0 6px 6px 0; display: inline-flex; align-items: center; transition: transform 0.1s; }
        .inline-edit-input { background: transparent; border: 1px solid transparent; outline: none; width: 100%; transition: all 0.2s; cursor: pointer; }
        .inline-edit-input:focus { background: #F1F5F9; border-bottom: 1px solid #94A3B8; border-radius: 4px; padding-left: 4px; cursor: text; }
        
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.35; }
        .sortable-ghost .draggable-card { background-color: #f1f5f9; border-style: dashed; border-color: #94a3b8; box-shadow: none; }
        .sortable-chosen .draggable-card { transform: scale(1.02); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.25); }
        /* 拖曳中的浮動卡片：關掉 transition，才能緊跟手指不延遲 */
        .sortable-fallback, .sortable-drag, .sortable-fallback *, .sortable-drag * { transition: none !important; animation: none !important; }
        .sortable-fallback { opacity: 0.95 !important; z-index: 9999 !important; pointer-events: none; }
        .spot-list-dragging .draggable-card { cursor: grabbing; }
        
        .photo-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .photo-gallery img { scroll-snap-align: start; flex-shrink: 0; width: 100%; height: 100%; object-fit: cover; }

        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        .pt-safe-8 { padding-top: calc(env(safe-area-inset-top, 0px) + 2rem); }
        
        /* Checkbox styling */
        .todo-checkbox { appearance: none; width: 16px; height: 16px; border: 2px solid #CBD5E1; border-radius: 4px; outline: none; cursor: pointer; transition: all 0.2s; position: relative; display: flex; align-items: center; justify-content: center; }
        .todo-checkbox:checked { background-color: #334155; border-color: #334155; }
        .todo-checkbox:checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; font-size: 9px; }
        
        /* Leaflet custom map popups & markers */
        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .leaflet-popup-content { font-family: 'Noto Sans TC', sans-serif; font-weight: bold; font-size: 13px; margin: 10px 14px; }
        .leaflet-custom-marker { background: none; border: none; }
        .leaflet-marker-icon { background: none; border: none; }
    </style>
    <style id="theme-style"></style>
</head>
<body>
    <div id="app"></div>

    <template id="app-template">
        <div class="app-container flex flex-col h-screen overflow-hidden">
            
            <!-- ================= 狀態 0：旅程一覽（首頁） ================= -->
            <div v-if="appState === 'home'" class="absolute inset-0 bg-[#F4F6F8] z-[80] overflow-y-auto overflow-x-hidden hide-scrollbar">
                <div class="px-5 pt-safe-8 animate-fade-in" style="padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));">
                    <div class="flex items-end justify-between mb-6 mt-1">
                        <div>
                            <p class="text-[10px] font-bold tracking-[0.3em] text-slate-400 uppercase font-serif">Taiwan Travel Journal</p>
                            <h1 class="text-[28px] font-serif font-bold text-[#1e293b] tracking-widest mt-1 leading-none">我的旅程</h1>
                        </div>
                        <button type="button" @click="showBackupModal = true" aria-label="設定" class="w-9 h-9 bg-white border border-slate-200 text-slate-500 rounded-full flex items-center justify-center shadow-sm active:scale-95 shrink-0">
                            <i class="fa-solid fa-gear text-[13px]"></i>
                        </button>
                    </div>

                    <!-- 下一趟 -->
                    <div v-if="nextTrip" @click="openTrip(nextTrip.id)" class="relative rounded-[22px] overflow-hidden h-[200px] shadow-md mb-8 cursor-pointer active:scale-[0.99] transition-transform select-none">
                        <img v-if="nextTrip.cover" :src="nextTrip.cover" :style="{ objectPosition: '50% ' + (nextTrip.coverPos || 50) + '%' }" class="absolute inset-0 w-full h-full object-cover">
                        <div v-else class="absolute inset-0" :style="coverFallbackStyle(nextTrip)"><i class="fa-solid fa-mountain-sun absolute right-6 top-6 text-white/25 text-[64px]"></i></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-black/10"></div>
                        <span class="absolute top-4 left-4 text-[10px] font-bold tracking-widest text-white border border-white/50 rounded-full px-2.5 py-1 backdrop-blur-sm">{{ tripStatus(nextTrip).ongoing ? '旅行中' : '下一趟' }}</span>
                        <div class="absolute left-5 right-5 bottom-4 flex items-end justify-between text-white gap-3">
                            <div class="min-w-0">
                                <p class="text-[11px] font-bold opacity-90 font-sans">{{ tripRangeText(nextTrip) }}<span class="mx-1.5 opacity-60">·</span>{{ tripLengthText(nextTrip) }}</p>
                                <h2 class="text-[21px] font-bold font-serif tracking-wide leading-snug truncate mt-0.5">{{ nextTrip.tripName }}</h2>
                                <p v-if="nextTrip.destination" class="text-[11px] font-bold opacity-80 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>{{ nextTrip.destination }}</p>
                            </div>
                            <div class="text-right shrink-0 leading-none">
                                <template v-if="tripStatus(nextTrip).ongoing">
                                    <p class="text-[10px] font-bold opacity-80 mb-1">今天是</p>
                                    <p class="font-serif font-bold text-[30px]">Day {{ tripStatus(nextTrip).dayNo }}</p>
                                </template>
                                <template v-else-if="tripStatus(nextTrip).daysLeft === 1">
                                    <p class="font-serif font-bold text-[24px]">明天出發</p>
                                </template>
                                <template v-else>
                                    <p class="text-[10px] font-bold opacity-80 mb-1">還有</p>
                                    <p><span class="font-serif font-bold text-[38px]">{{ tripStatus(nextTrip).daysLeft }}</span><span class="text-[12px] font-bold ml-1">天</span></p>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 時間軸 -->
                    <div v-for="sec in homeSections" :key="sec.key" class="mb-7">
                        <div class="flex items-baseline mb-3 px-1">
                            <h3 class="font-serif font-bold text-slate-800" :class="sec.past ? 'text-[22px]' : 'text-[15px]'">{{ sec.title }}</h3>
                            <span class="text-[11px] font-bold text-slate-400 ml-2">{{ sec.sub }}</span>
                        </div>
                        <div>
                            <div v-for="(t, ti) in sec.items" :key="t.id" class="relative flex" :class="sec.past ? 'opacity-[0.88]' : ''">
                                <div class="w-[46px] shrink-0 text-right pt-[14px]">
                                    <div class="text-[16px] font-serif font-bold text-slate-800 leading-none tracking-tight">{{ fmtMD(t.startDate) }}</div>
                                    <div class="text-[10px] font-bold text-slate-400 mt-1">{{ weekdayOf(t.startDate) }}</div>
                                </div>
                                <div class="relative w-[24px] shrink-0 flex justify-center">
                                    <div v-if="sec.items.length > 1" class="absolute w-[2px] bg-slate-200" :class="[ti === 0 ? 'top-[18px]' : 'top-0', ti === sec.items.length - 1 ? 'h-[18px]' : 'bottom-0']"></div>
                                    <div class="relative z-10 mt-[13px] w-[11px] h-[11px] rounded-full border-[2.5px] bg-white" :style="{ borderColor: sec.past ? '#CBD5E1' : currentTheme.accent }"></div>
                                </div>
                                <div class="flex-1 min-w-0 pl-1.5 pb-3.5">
                                    <div @click="openTrip(t.id)" class="bg-white rounded-2xl border border-slate-100 shadow-sm flex items-stretch overflow-hidden cursor-pointer active:scale-[0.99] transition-transform">
                                        <div class="w-[72px] shrink-0 relative overflow-hidden">
                                            <img v-if="t.cover" :src="t.cover" :style="{ objectPosition: '50% ' + (t.coverPos || 50) + '%' }" class="absolute inset-0 w-full h-full object-cover" :class="sec.past ? 'grayscale-[35%]' : ''">
                                            <div v-else class="absolute inset-0 flex items-center justify-center" :style="coverFallbackStyle(t)"><i class="fa-solid fa-map-location-dot text-white/70 text-lg"></i></div>
                                        </div>
                                        <div class="flex-1 min-w-0 px-3 py-2.5">
                                            <p class="text-[14px] font-bold text-slate-800 truncate leading-snug">{{ t.tripName }}</p>
                                            <p class="text-[11px] font-bold text-slate-400 mt-1 truncate">
                                                <span class="text-[10px] px-1.5 py-[2px] rounded mr-1.5" :style="{ backgroundColor: currentTheme.soft, color: currentTheme.text }">{{ tripLengthText(t) }}</span><span v-if="t.destination"><i class="fa-solid fa-location-dot mr-0.5 text-[9px]"></i>{{ t.destination }}</span>
                                            </p>
                                            <p class="text-[10px] font-bold text-slate-400 mt-1 font-sans">{{ tripRangeText(t) }}<span v-if="t.spotCount">・{{ t.spotCount }} 個行程</span><span v-if="!sec.past && tripStatus(t).daysLeft > 0">・還有 {{ tripStatus(t).daysLeft }} 天</span></p>
                                        </div>
                                        <button type="button" @click.stop="tripMenu = t" aria-label="更多" class="w-9 shrink-0 text-slate-300 flex items-center justify-center active:text-slate-600"><i class="fa-solid fa-ellipsis-vertical text-[13px]"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div v-if="trips.length === 0" class="text-center pt-12 pb-6">
                        <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4" :style="{ backgroundColor: currentTheme.soft, color: currentTheme.accent2 }"><i class="fa-solid fa-route text-2xl"></i></div>
                        <p class="text-[15px] font-bold text-slate-600 font-serif">還沒有任何旅程</p>
                        <p class="text-[12px] text-slate-400 mt-1.5 leading-relaxed">連假的三天兩夜，或是週末的一日約會，<br>按下方「＋」把它記下來吧。</p>
                    </div>
                </div>
                <div class="fixed bottom-0 w-full max-w-[430px] px-5 flex justify-end pointer-events-none z-[81]" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);">
                    <button type="button" @click="newTrip" class="pointer-events-auto h-12 pl-4 pr-5 rounded-full text-white font-bold text-[14px] shadow-lg active:scale-95 transition-transform flex items-center bg-[#1e293b]">
                        <i class="fa-solid fa-plus mr-2"></i>新增旅程
                    </button>
                </div>
            </div>

            <!-- 旅程操作選單 -->
            <div v-if="tripMenu" @click.self="tripMenu = null" class="fixed inset-0 z-[95] flex items-end sm:items-center justify-center bg-slate-900/50 backdrop-blur-sm">
                <div class="bg-white w-full max-w-[430px] rounded-t-3xl sm:rounded-3xl p-4 pb-safe animate-slide-up shadow-2xl">
                    <div class="px-2 pt-1 pb-3">
                        <p class="text-[16px] font-bold text-slate-800 truncate">{{ tripMenu.tripName }}</p>
                        <p class="text-[11px] font-bold text-slate-400 mt-0.5 font-sans">{{ tripRangeText(tripMenu) }}・{{ tripLengthText(tripMenu) }}</p>
                    </div>
                    <div class="rounded-2xl border border-slate-100 overflow-hidden divide-y divide-slate-100 mb-3">
                        <button type="button" @click="openTrip(tripMenu.id); tripMenu = null" class="w-full flex items-center px-4 py-3.5 text-left active:bg-slate-50"><i class="fa-solid fa-book-open w-6 text-[#3F7FB0]"></i><span class="text-[14px] font-bold text-slate-800">打開行程</span></button>
                        <button type="button" @click="editTripFromMenu(tripMenu)" class="w-full flex items-center px-4 py-3.5 text-left active:bg-slate-50"><i class="fa-solid fa-pen w-6 text-[#3F7FB0]"></i><span class="text-[14px] font-bold text-slate-800">修改名稱與日期</span></button>
                        <button type="button" @click="duplicateTrip(tripMenu)" class="w-full flex items-center px-4 py-3.5 text-left active:bg-slate-50"><i class="fa-regular fa-copy w-6 text-[#3F7FB0]"></i><span class="flex-1"><span class="block text-[14px] font-bold text-slate-800">複製一份</span><span class="block text-[11px] font-bold text-slate-400">同樣的行程再走一次，改個日期就好</span></span></button>
                        <button type="button" @click="exportTripBackup(tripMenu)" class="w-full flex items-center px-4 py-3.5 text-left active:bg-slate-50"><i class="fa-solid fa-file-arrow-down w-6 text-[#3F7FB0]"></i><span class="text-[14px] font-bold text-slate-800">下載這趟的備份檔</span></button>
                        <button type="button" @click="deleteTrip(tripMenu)" class="w-full flex items-center px-4 py-3.5 text-left active:bg-red-50"><i class="fa-regular fa-trash-can w-6 text-red-400"></i><span class="text-[14px] font-bold text-red-500">刪除這趟旅程</span></button>
                    </div>
                    <button type="button" @click="tripMenu = null" class="w-full py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-[14px]">取消</button>
                </div>
            </div>

            <!-- ================= 狀態 1：旅程設定頁面 ================= -->
            <div v-if="appState === 'setup'" class="absolute inset-0 bg-[#F4F6F8] z-[100] overflow-y-auto pb-safe overflow-x-hidden hide-scrollbar">
                <div class="min-h-full flex flex-col px-5 pb-8 pt-safe-8 animate-fade-in">
                    <div class="text-left mb-3"><button type="button" @click="cancelEdit" class="h-9 px-3 rounded-full bg-white border border-slate-200 text-[12px] font-bold text-slate-500 shadow-sm active:scale-95"><i class="fa-solid fa-chevron-left mr-1"></i>{{ isEditing ? '返回（不儲存）' : '返回旅程一覽' }}</button></div>
                    <div class="mb-5 mt-2 text-center shrink-0">
                        <h1 class="text-[28px] font-serif font-bold text-[#1e293b] mb-2 tracking-widest">{{ isEditing ? '修改旅程設定' : '新的旅程' }}</h1>
                        <p class="text-[#64748B] text-[13px] leading-relaxed tracking-wider font-serif">不用飛很遠，也能好好出發。<br>寫下日期與地點，為這段時光命名。</p>
                    </div>

                    <div class="bg-white rounded-[20px] p-5 shadow-sm border border-slate-100 max-w-[400px] mx-auto w-full mb-4 shrink-0">
                        <div class="mb-4">
                            <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">旅程名稱</label>
                            <input type="text" v-model="tripInfo.tripName" placeholder="例如：雙十連假台中遊" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm font-bold text-[#1e293b] outline-none focus:border-brand">
                        </div>
                        <div class="mb-4">
                            <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">地點（縣市或區域）</label>
                            <input type="text" v-model="tripInfo.destination" placeholder="例如：台南、九份、墾丁" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-sm font-bold text-[#1e293b] outline-none focus:border-brand">
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                <button type="button" v-for="c in taiwanCities" :key="'city'+c" @click="tripInfo.destination = c"
                                        class="text-[11px] font-bold px-2.5 py-1 rounded-full border transition-colors"
                                        :style="tripInfo.destination === c ? { backgroundColor: currentTheme.accent, borderColor: currentTheme.accent, color: currentTheme.onAccent } : { backgroundColor: '#fff', borderColor: '#E2E8F0', color: '#64748B' }">{{ c }}</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-[10px] font-bold text-[#94a3b8] mb-1.5 tracking-widest">旅程類型</label>
                            <div class="flex bg-slate-100 rounded-lg p-0.5">
                                <button type="button" @click="setDayTrip(true)" class="flex-1 py-1.5 rounded-md text-[12px] font-bold transition-colors" :class="isDayTrip ? 'bg-white text-[#1E4E79] shadow-sm' : 'text-slate-400'"><i class="fa-regular fa-sun mr-1"></i>一日遊</button>
                                <button type="button" @click="setDayTrip(false)" class="flex-1 py-1.5 rounded-md text-[12px] font-bold transition-colors" :class="!isDayTrip ? 'bg-white text-[#1E4E79] shadow-sm' : 'text-slate-400'"><i class="fa-solid fa-moon mr-1"></i>多日遊</button>
                            </div>
                        </div>

                                    <input type="text" v-model="newLinkTitle" placeholder="連結標題（選填，例：官網、Klook 門票）" class="w-full min-w-0 bg-white border border-slate-200 shadow-sm rounded-lg px-2 py-1.5 text-xs outline-none focus:border-brand">

                                        <input type="text" v-model="newLinkUrl" @keyup.enter="addLink" placeholder="網址 (https://...)" class="flex-1 min-w-0 bg-white border border-slate-200 shadow-sm rounded-lg px-2 py-1.5 text-xs outline-none focus:border-brand">

    <script id="main-script">
        const { createApp } = Vue;

        // Leaflet 地圖與 ECharts 圖表物件放在 Vue 外面：
        // 放進 data() 會被 Vue 包成 Proxy，Leaflet 縮放/加標記時會出錯，導致地圖出不來
        let _leafletMap = null, _leafletLayer = null, _leafletResizeObs = null, _mapRenderToken = 0;
        let _expenseChart = null;
        let _pdfDoc = null;
                const _geoCache = {};

        // ===== 資料儲存 =====
        // 每趟旅程各存一筆（trip:<id>），另外存一份「旅程一覽」(index) 與共用設定 (global)。
        // 一律等資料庫準備好才讀寫，並在 localStorage 多存一份備援。
        const DB_NAME = 'TaiwanTripAppDB_v1';
        const LS_PREFIX = 'twTripApp_';
        let isDBAvailable = true;
        const dbPromise = new Promise((resolve) => {
            try {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => { e.target.result.createObjectStore('store'); };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = () => { isDBAvailable = false; resolve(null); };
                request.onblocked = () => { isDBAvailable = false; resolve(null); };
            } catch (e) { isDBAvailable = false; resolve(null); }
        });
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

        // 照片、附件太大放不進 localStorage 時，存一份不含照片的版本
        function liteCopy(val) {
            const lite = JSON.parse(JSON.stringify(val));
            const strip = (t) => (t.itinerary || []).forEach(d => {
                if (d.hero && /^data:/.test(d.hero.image || '')) d.hero.image = '';
                (d.spots || []).forEach(sp => { sp.images = []; sp.files = []; sp.coverImage = ''; });
            });
            if (Array.isArray(lite)) lite.forEach(t => { if (t && /^data:/.test(t.cover || '')) t.cover = ''; });
            else strip(lite);
            return lite;
        }
        async function saveToDB(key, val) {
            if (window.__PRELOADED_STATE__) return false;
            let ok = false;
            try {
                const db = await dbPromise;
                if (db) {
                    await new Promise((resolve, reject) => {
                        const tx = db.transaction('store', 'readwrite');
                        tx.objectStore('store').put(val, key);
                        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
                    });
                    ok = true;
                }
            } catch (e) { console.warn('IndexedDB save failed', e); }
            try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); }
            catch (e) { try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(liteCopy(val))); } catch (e2) {} }
            return ok;
        }
        async function loadFromDB(key) {
            try {
                const db = await dbPromise;
                if (db) {
                    const v = await new Promise((resolve) => {
                        const tx = db.transaction('store', 'readonly');
                        const req = tx.objectStore('store').get(key);

            computed: {
                startYear() { return this.tripInfo.startDate ? this.tripInfo.startDate.substring(0, 4) : '2026'; },
                endYear() { return this.tripInfo.endDate ? this.tripInfo.endDate.substring(0, 4) : this.startYear; },
                calculatedDays() {
                    if (!this.tripInfo.startDate || !this.tripInfo.endDate) return 0;
                    const start = new Date(this.tripInfo.startDate);
                    const end = new Date(this.tripInfo.endDate);
                    if(end < start) return 0;
                    return Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
                },
                calculatedNights() { return Math.max(0, this.calculatedDays - 1); },
                
                englishDestination() {
                    const d = (this.tripInfo.destination || '').trim();
                    const key = Object.keys(this.dictionary).find(k => d.startsWith(k));
                    const city = this.tripInfo.destinationEN || (key ? this.dictionary[key] : '');
                    return (city ? `${city}, Taiwan` : 'Taiwan').toUpperCase();
                },
                isDayTrip() { return !!this.tripInfo.startDate && this.tripInfo.startDate === this.tripInfo.endDate; },
                tripDateRangeText() { return this.tripRangeText(this.tripInfo); },
                todayYMD() { return this.toYMD(new Date(this.nowTick)); },
                sortedTrips() { return (this.trips || []).slice().sort((a, b) => (a.startDate || '').localeCompare(b.startDate || '')); },
                // 首頁大卡片：正在進行中、或最近一趟還沒出發的旅程
                nextTrip() {
                    const today = this.todayYMD;
                    return this.sortedTrips.find(t => (t.endDate || t.startDate || '') >= today) || null;
                },
                homeSections() {
                    const today = this.todayYMD, next = this.nextTrip;
                    const upcoming = this.sortedTrips.filter(t => (t.endDate || t.startDate || '') >= today && t !== next);
                    const past = this.sortedTrips.filter(t => (t.endDate || t.startDate || '') < today).reverse();
                    const out = [];
                    if (upcoming.length) out.push({ key: 'up', title: '接下來', sub: upcoming.length + ' 趟', items: upcoming, past: false });
                    const byYear = {};
                    past.forEach(t => { const y = (t.startDate || '').slice(0, 4) || '未定'; (byYear[y] = byYear[y] || []).push(t); });
                    Object.keys(byYear).sort().reverse().forEach(y => out.push({ key: 'y' + y, title: y, sub: '回憶・' + byYear[y].length + ' 趟', items: byYear[y], past: true }));
                    return out;
                },
                perDayCost() { return this.calculatedDays > 1 ? Math.round(this.filteredGrandTotalTWD / this.calculatedDays) : 0; },
                
                formattedImagesForGallery() {
                    if (!this.selectedSpot.images || this.selectedSpot.images.length === 0) {
                        if (this.selectedSpot.coverImage) return [{ url: this.selectedSpot.coverImage, pos: this.selectedSpot.coverPosition, desc: this.selectedSpot.photoSpotDesc }];
                        return [];
                    }
                    return this.selectedSpot.images.map(img => {
                        if (typeof img === 'string') return { url: img, pos: 50, desc: '' };
                        return img;
                    });
                },

                filteredGrandTotalTWD() {
                    let total = 0;
                    this.itinerary.forEach(day => (day.spots || []).forEach(spot => { total += Number(spot.cost) || 0; }));
                    return Math.round(total);
                },

                currentTheme() {
                    return buildTheme(this.themeSource(this.settings.themeId));
                },
                themeModified() {
                    return !!(this.settings.overrides && this.settings.overrides[this.settings.themeId]);
                },
                isPresetTheme() { return THEME_PRESETS.some(x => x.id === this.settings.themeId); },
                activeThemeName() { return this.currentTheme.name; },
                checkPlaceholder() {
                    return { '必吃': '例：牛肉湯、古早味豆花', '必買': '例：伴手禮、文創小物', '必拍': '例：老街入口、夕陽機位', '必做': '例：蓋紀念章、求平安符' }[this.newCheckKind] || '輸入項目';
                },
                checklistSuggestions() {
                    const t = this.selectedSpot && this.selectedSpot.type;
                    const map = {
                        spot: [['必拍', '經典打卡機位'], ['必拍', '夕陽／夜景'], ['必買', '文創小物'], ['必買', '平安符'], ['必做', '蓋紀念章'], ['必做', '查好停車場']],
                        food: [['必吃', '招牌菜'], ['必吃', '在地小吃'], ['必做', '提早排隊／訂位'], ['必買', '伴手禮']],
                        shopping: [['必買', '伴手禮'], ['必買', '在地特產'], ['必做', '集點／會員卡']]
                    };
                    return (map[t] || []).map(([kind, text]) => ({ kind, text, brand: '' }));
                },
                // 同行者名單：旅客本人＋自訂付款人＋行程裡出現過的付款人
                peopleList() {
                    const set = [];
                    const add = (n) => { n = (n || '').trim(); if (n && n !== '自訂' && !set.includes(n)) set.push(n); };
                    (this.customPayers || []).forEach(add);
                    this.itinerary.forEach(d => (d.spots || []).forEach(sp => { add(sp.payer); (sp.advances || []).forEach(a => add(a.person)); }));
                    return set;
                },
                advanceCandidates() {
                    const payer = this.selectedSpot && this.selectedSpot.payer;
                    return this.peopleList.filter(p => p !== payer);
                },
                // 分帳：A 要給 B 多少（台幣，兩人之間互相抵銷）
                settlement() {
                    const details = [];
                    this.itinerary.forEach((day, dIdx) => (day.spots || []).forEach((sp, sIdx) => {
                        if (!sp.isAdvance || !sp.payer || !Array.isArray(sp.advances)) return;
                        sp.advances.forEach(a => {
                            const amt = parseFloat(String(a.amount || '').replace(/[^\d.]/g, '')) || 0;
                            if (!amt || !a.person || a.person === sp.payer) return;
                            const ntd = amt;
                            details.push({ from: a.person, to: sp.payer, orig: amt, ntd, currency: sp.currency, name: sp.name || '未命名', date: day.shortDate, dayIdx: dIdx, spotIdx: sIdx });
                        });
                    }));
                    const net = {};
                    details.forEach(d => {
                        const [x, y] = [d.from, d.to].sort();
                        const k = x + '\u0000' + y;
                        net[k] = (net[k] || 0) + (d.from === x ? d.ntd : -d.ntd);
                    });
                    const results = Object.keys(net).map(k => {
                        const [x, y] = k.split('\u0000'); const v = net[k];
                        return v > 0 ? { from: x, to: y, ntd: v } : { from: y, to: x, ntd: -v };
                    }).filter(r => Math.round(r.ntd) > 0).sort((a, b) => b.ntd - a.ntd);
                    return { results, details };
                },
                todoTotals() {
                    let done = 0, total = 0;
                    this.todoCategories.forEach(c => (c.subcategories || []).forEach(s => (s.items || []).forEach(i => { total++; if (i.done) done++; })));
                    return { done, total };
                },
                currentDaySpotCount() {
                    const d = this.itinerary[this.activeDay];
                    return d && d.spots ? d.spots.length : 0;
                },
                navSpotsForMapDay() {
                    if (this.mapFilterDay === -1 || !this.itinerary[this.mapFilterDay]) return [];
                    return (this.itinerary[this.mapFilterDay].spots || []).filter(spot => spot.type !== 'transit' && (spot.location || spot.googleMapUrl));
                },
                expenseBreakdown() {
                    const map = {};
                    let total = 0;
                    this.itinerary.forEach(day => {
                        (day.spots || []).forEach(spot => {
                            if (!(spot.cost && Number(spot.cost) > 0)) return;
                            const key = this.getExpenseKey(spot);
                            const ntd = this.toNTD(spot);
                            map[key] = (map[key] || 0) + ntd;
                            total += ntd;
                        });
                    });
                    const palette = this.expensePalette;
                    return Object.keys(map)
                        .map(k => ({ name: k, value: Math.round(map[k]), pct: total > 0 ? (map[k] / total * 100) : 0 }))
                        .sort((a, b) => b.value - a.value)
                        .map((row, i) => ({ ...row, color: palette[i % palette.length] }));
                },
                expenseBreakdownTotal() {
                    return this.expenseBreakdown.reduce((sum, r) => sum + r.value, 0);
                },
                expenseDetailItems() {
                    if (!this.expenseDetailKey) return [];
                    const items = [];
                    this.itinerary.forEach((day, dIdx) => {
                        (day.spots || []).forEach((spot, sIdx) => {
                            if (!(spot.cost && Number(spot.cost) > 0)) return;
                            if (this.getExpenseKey(spot) !== this.expenseDetailKey) return;
                            items.push({
                                dayIdx: dIdx, spotIdx: sIdx, dayLabel: day.label, shortDate: day.shortDate, rawDate: day.rawDate || '', dayOfWeekEN: day.dayOfWeekEN,
                                time: spot.startTime || spot.checkInTime || '', name: spot.name || '未命名', type: spot.type,
                                currency: spot.currency, cost: Number(spot.cost), ntd: Math.round(this.toNTD(spot)),
                                category: this.getExpenseCategory(spot), payer: spot.payer || '未設定', method: spot.paymentMethod || '現金'
                            });
                        });
                    });
                    items.sort((a, b) => (a.rawDate.localeCompare(b.rawDate)) || (a.dayIdx - b.dayIdx) || ((a.time || '99:99').localeCompare(b.time || '99:99')) || (a.spotIdx - b.spotIdx));
                    // 依日期分組
                    const groups = [];
                    items.forEach(it => {
                        let g = groups[groups.length - 1];
                        if (!g || g.dayIdx !== it.dayIdx) { g = { dayIdx: it.dayIdx, dayLabel: it.dayLabel, shortDate: it.shortDate, dayOfWeekEN: it.dayOfWeekEN, subtotal: 0, items: [] }; groups.push(g); }
                        g.items.push(it); g.subtotal += it.ntd;
                    });
                    return groups;
                },
                expenseDetailSummary() {
                    const row = this.expenseBreakdown.find(r => r.name === this.expenseDetailKey);
                    const count = this.expenseDetailItems.reduce((n, g) => n + g.items.length, 0);
                    return { total: row ? row.value : 0, pct: row ? row.pct : 0, color: row ? row.color : '#7E93A3', count };
                },
                expenseFilterLabel() {
                    return { category: '大類別', payer: '付款人', method: '付款方式', tag: '花費類別' }[this.expenseFilterType] || '';
                },
                expensePalette() {
                    return this.currentTheme.palette;
                },
                routeSpotsForDay() {
                    if (!this.itinerary[this.routeActiveDay] || !this.itinerary[this.routeActiveDay].spots) return [];
                    return this.itinerary[this.routeActiveDay].spots.filter(spot => spot.location || spot.googleMapUrl);
                },

                overviewHotels() {
                    // 有填入住＋退房日期 → 直接算晚數；沒填退房 → 用同一家飯店連續出現的天數推算
                    const list = [], seen = {};
                    this.itinerary.forEach((day, dIdx) => (day.spots || []).forEach((spot, sIdx) => {
                        if (spot.type !== 'hotel') return;
                        const name = spot.name || '住宿';
                        if (spot.checkInDate && spot.checkOutDate && this.hotelNights(spot) > 0) {
                            const key = name + '|' + spot.checkInDate + '|' + spot.checkOutDate;
                            if (seen[key]) return;   // 同一筆訂房在好幾天都有卡片，只算一次
                            seen[key] = true;
                            list.push({ name, start: spot.checkInDate, end: spot.checkOutDate, nights: this.hotelNights(spot), dayIdx: dIdx, spotIdx: sIdx });
                        } else {
                            const start = spot.checkInDate || day.rawDate;
                            const last = list[list.length - 1];
                            if (last && last.fallback && last.name === name && last.lastDayIdx === dIdx - 1) {
                                last.nights += 1; last.end = this.addDaysYMD(day.rawDate, 1); last.lastDayIdx = dIdx;
                                return;
                            }
                            list.push({ name, start, end: this.addDaysYMD(start, 1), nights: 1, dayIdx: dIdx, spotIdx: sIdx, fallback: true, lastDayIdx: dIdx });
                        }
                    }));
                    list.sort((x, y) => (x.start || '').localeCompare(y.start || ''));
                    return list.map(h => ({ ...h, dateStr: `${this.fmtMD(h.start)} - ${this.fmtMD(h.end)}` }));
                }
            },
            watch: {
                tripInfo: { handler() { this.autoSave(); }, deep: true },
                itinerary: { handler() { this.autoSave(); }, deep: true },
                todoCategories: { handler() { this.autoSave(); }, deep: true },
                settings: { handler() { this.applyTheme(); this.autoSave(); }, deep: true },
                customCostCategories: { handler() { this.autoSave(); }, deep: true },
                costCategoryList: { handler() { this.autoSave(); }, deep: true },
                customPayers: { handler() { this.autoSave(); }, deep: true },
                customPaymentMethods: { handler() { this.autoSave(); }, deep: true },
                customTransits: { handler() { this.autoSave(); }, deep: true },
                appState() { this.autoSave(); },
                isGenerated() { this.autoSave(); },
                
                'selectedSpot.type': function(n) {
                    if (this.spotModalMode !== 'view' && !this.newCheckText) this.newCheckKind = this.defaultKindFor(n);
                },
                'tripInfo.destination': function(newVal) { this.tripInfo.destinationEN = this.dictionary[(newVal || '').trim()] || ''; },
                
                currentTab(newVal) {
                    const ms = document.getElementById('main-scroll'); if (ms) ms.scrollTop = 0;   // 換分頁時回到最上面
                    if (newVal === 'itinerary') this.$nextTick(() => { this.initSortableItinerary(); });
                    if (newVal === 'todo') this.$nextTick(() => { this.initSortableTodo(); });
                    if (newVal === 'expense') this.$nextTick(() => { this.initExpenseChart(); });
                    if (newVal === 'info') {
                        setTimeout(() => { this.renderMap(); }, 100);
                    }
                },
                activeDay() {
                    if (this.currentTab === 'itinerary') this.$nextTick(() => { this.initSortableItinerary(); });
                },
                currentDaySpotCount(newVal, oldVal) {
                    // 空白天加入第一個行程時，清單才出現，要重新綁定拖曳
                    if (this.currentTab === 'itinerary' && !this.isDraggingSpot && (oldVal === 0 || newVal === 0)) {
                        this.$nextTick(() => { this.initSortableItinerary(); });
                    }
                },
                expenseBreakdown() {
                    if (this.currentTab === 'expense') this.$nextTick(() => { this.updateExpenseChart(); });
                }
            },
            async mounted() {
                // 離開 App / 切到背景時，立刻把還沒存的變更存起來（iPhone 可能直接關掉 App）
                const flush = () => { if (this.isStateLoaded && this.saveTimeout) { clearTimeout(this.saveTimeout); this.saveTimeout = null; this.saveNow(); } };
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
                window.addEventListener('pagehide', flush);
                // 每分鐘更新「現在」紅點與倒數
                setInterval(() => { this.nowTick = Date.now(); }, 60000);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.nowTick = Date.now(); });
                // 鎖定畫面縮放（iPhone 雙指縮放）
                document.addEventListener('gesturestart', (e) => e.preventDefault());

                // 時光膠囊：匯出的單一網頁檔，直接顯示那一趟
                if (window.__PRELOADED_STATE__) {
                    const st = window.__PRELOADED_STATE__;
                    this.isCapsule = true;
                    this.applyGlobal(st.global || st);
                    this.restoreTrip(st);
                    this.currentTripId = 'capsule';
                    this.appState = 'main';
                    this.isStateLoaded = true;
                    this.applyTheme();
                    this.$nextTick(() => this.initSortableItinerary());
                    return;
                }

                try {
                    const g = await loadFromDB('global');
                    if (g) this.applyGlobal(g);
                    const idx = await loadFromDB('index');
                    this.trips = Array.isArray(idx) ? idx : [];
                } catch (e) {
                    console.warn('DB Load failed', e);
                }
                this.applyTheme();
                // 讀取完成後才開始自動儲存，避免空白資料蓋掉原本的資料
                this.$nextTick(() => { this.isStateLoaded = true; });
            },
            methods: {
                // ===== 多趟旅程：讀取、儲存、切換 =====
                applyGlobal(data) {
                    if (!data) return;
                    this.customCostCategories = data.customCostCategories || [];
                    if (Array.isArray(data.costCategoryList) && data.costCategoryList.length) this.costCategoryList = data.costCategoryList.map(c => ({ name: c.name, emoji: c.emoji }));
                    this.customPayers = data.customPayers || [];
                    this.customPaymentMethods = data.customPaymentMethods || [];
                    this.customTransits = data.customTransits || [];
                    if (data.settings) {
                        const st = Object.assign({ themeId: 'ocean', overrides: {}, savedThemes: [] }, data.settings);
                        delete st.custom;
                        if (!THEME_PRESETS.some(x => x.id === st.themeId) && !st.savedThemes.some(x => x.id === st.themeId)) st.themeId = 'ocean';
                        this.settings = st;
                    }
                },
                globalSnapshot() {
                    return JSON.parse(JSON.stringify({
                        settings: this.settings, customCostCategories: this.customCostCategories,
                        costCategoryList: (this.costCategoryList || []).map(c => ({ name: c.name, emoji: c.emoji })),
                        customPayers: this.customPayers, customPaymentMethods: this.customPaymentMethods, customTransits: this.customTransits
                    }));
                },
                blankTripInfo() {
                    return { tripName: '', destination: '', country: '台灣', destinationEN: '', countryEN: 'Taiwan', startDate: '', endDate: '' };
                },
                restoreTrip(data) {
                    try {
                        const ti = Object.assign(this.blankTripInfo(), data.tripInfo || {});
                        ['flights', 'departureAirport', 'arrivalAirport', 'passengerName', 'flightInfo', 'seat', 'boardingTime'].forEach(k => { delete ti[k]; });
                        ti.country = '台灣'; ti.countryEN = 'Taiwan';
                        this.tripInfo = ti;
                        this.itinerary = data.itinerary || [];
                        this.ensureSpotIds();
                        this.itinerary.forEach(day => (day.spots || []).forEach(spot => {
                            if (spot.lat && spot.lng && !spot.geoSource) {
                                if (this.parseLatLngFromUrl(spot.googleMapUrl)) spot.geoSource = 'url';
                                else { spot.lat = null; spot.lng = null; }
                            }
                            if (spot.costCategory === '活動') spot.costCategory = '活動/門票';
                        }));
                        this.todoCategories = data.todoCategories || [];
                        this.isGenerated = true;
                    } catch (err) {
                        console.error('Restore Trip Error', err);
                    }
                },
                tripDataSnapshot() {
                    return JSON.parse(JSON.stringify({ tripInfo: this.tripInfo, itinerary: this.itinerary, todoCategories: this.todoCategories, isGenerated: true }));
                },
                // 旅程一覽用的摘要（名稱、日期、封面、行程數）
                tripSummaryOf(id, data) {
                    const ti = data.tripInfo || {}, days = data.itinerary || [];
                    let cover = '', coverPos = 50, spotCount = 0;
                    const heroDay = days.find(d => d.hero && d.hero.image);
                    if (heroDay) { cover = heroDay.hero.image; coverPos = heroDay.hero.position || 50; }
                    days.forEach(d => (d.spots || []).forEach(sp => {
                        spotCount++;
                        if (!cover && sp.coverImage) { cover = sp.coverImage; coverPos = sp.coverPosition || 50; }
                    }));
                    return { id, tripName: ti.tripName || ((ti.destination || '台灣') + '之旅'), destination: ti.destination || '', startDate: ti.startDate || '', endDate: ti.endDate || ti.startDate || '', cover, coverPos, spotCount, updatedAt: Date.now() };
                },
                upsertTripSummary(s) {
                    const i = this.trips.findIndex(t => t.id === s.id);
                    if (i >= 0) this.trips.splice(i, 1, s); else this.trips.push(s);
                },
                async saveIndex() { await saveToDB('index', JSON.parse(JSON.stringify(this.trips))); },
                autoSave() {
                    if (window.__PRELOADED_STATE__ || !this.isStateLoaded) return;
                    clearTimeout(this.saveTimeout);

                daysBetween(a, b) { const A = this.parseYMD(a), B = this.parseYMD(b); return (A && B) ? Math.round((B - A) / 86400000) : 0; },
                weekdayOf(ymd) { const d = this.parseYMD(ymd); return d ? '週' + WEEK_ZH[d.getDay()] : ''; },
                tripLengthText(t) {

                // 依新的日期區間，算出每一天要放哪些行程

                planItineraryDates() {
                    const start = this.parseYMD(this.tripInfo.startDate), end = this.parseYMD(this.tripInfo.endDate);
                    const newDates = [];
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) newDates.push(this.toYMD(d));
                    const old = this.itinerary;
                    let result, removed = [];
                    if (newDates.length === old.length) {
                        result = old.slice();
                    } else {
                        const byDate = {};
                        old.forEach(day => { if (day.rawDate) byDate[day.rawDate] = day; });
                        const overlap = newDates.some(d => byDate[d]);
                        if (overlap) {

                blankLeg(from) { return { line: '', from: from || '', to: '', direction: '', platform: '', trainType: '', note: '' }; },

                // 自訂交通方式：依名稱自動判斷圖示與填寫方式

                    i = Math.max(0, Math.min(steps.length - 1, i + dir));

                },
                async shareFile(file) {
                    try {
                        const mime = this.dataUrlMime(file.url);
                        const blob = new Blob([this.dataUrlToBytes(file.url)], { type: mime });
                        const f = new File([blob], file.name || 'file', { type: mime });
                        if (navigator.canShare && navigator.canShare({ files: [f] })) {
                            await navigator.share({ files: [f], title: file.name });
                            return;
                        }
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = file.name || 'file'; a.target = '_blank';
                        document.body.appendChild(a); a.click(); a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 60000);
                    } catch (e) {
                        if (e && e.name === 'AbortError') return;
                        alert('無法分享這個檔案：' + e.message);
                    }
                },

                swapDays(a, b) {

                    const A = this.itinerary[a], B = this.itinerary[b];

                jumpToDay(dayIdx) {

                        (day.spots || []).forEach(spot => {

                initSortableItinerary() {

                                const { item, from } = evt;

                },

                // --- 解析「Google Maps 欄位」內容 ---
                // 支援：完整網址（含 @座標 或 !3d!4d）、直接貼座標「25.1092, 121.8448」、
                //       從 Google Maps App「分享」整段貼上的文字（店名＋地址＋短網址）
                parseLatLngFromUrl(url) {
                    if (!url) return null;
                    let u = String(url);
                    try { u = decodeURIComponent(u); } catch (e) {}
                    const ok = (a, b) => { a = parseFloat(a); b = parseFloat(b); return (isFinite(a) && isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180 && !(a === 0 && b === 0)) ? { lat: a, lng: b } : null; };
                    let m;
                    if ((m = u.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/))) return ok(m[1], m[2]);      // 地點的精確座標（優先）
                    if ((m = u.match(/[?&](?:q|ll|query|destination|center)=(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/))) return ok(m[1], m[2]);
                    if ((m = u.match(/\/place\/(-?\d+\.\d+),\s*(-?\d+\.\d+)/))) return ok(m[1], m[2]);
                    if ((m = u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/))) return ok(m[1], m[2]);          // 視角中心
                    // 直接貼上的座標（Google Maps 長按地點 → 複製座標）
                    if ((m = u.match(/(-?\d{1,2}\.\d{3,})\s*[,，]\s*(-?\d{1,3}\.\d{3,})/))) return ok(m[1], m[2]);
                    return null;
                },
                extractMapUrl(text) {
                    const m = String(text || '').match(/https?:\/\/\S+/);
                    return m ? m[0] : '';
                },
                isShortMapLink(text) {
                    return /(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test(String(text || ''));
                },
                // 分享文字裡「網址以外」的部分（通常是 店名＋地址），Google 自己產生的，拿來搜尋最準
                extractShareText(text) {
                    let t = String(text || '');
                    if (!t.trim() || this.parseLatLngFromUrl(t)) return '';
                    t = t.replace(/https?:\/\/\S+/g, ' ')
                         .split(/\n+/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).join(', ');
                    if (/^-?\d+\.\d+\s*[,，]/.test(t)) return '';
                    return t;
                },
                getMapFieldStatus(spot) {
                    const v = (spot && spot.googleMapUrl || '').trim();
                    if (!v) return { kind: 'empty' };
                    const c = this.parseLatLngFromUrl(v);
                    if (c) return { kind: 'exact', text: `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}` };
                    const share = this.extractShareText(v);
                    if (share) return { kind: 'share', text: share };
                    if (this.isShortMapLink(v)) return { kind: 'short', url: this.extractMapUrl(v) };
                    const pn = this.parsePlaceNameFromUrl(v);
                    if (pn) return { kind: 'share', text: pn };
                    return { kind: 'unknown' };
                },
                getSpotMapHref(spot) {
                    const url = this.extractMapUrl(spot.googleMapUrl);
                    if (url) return url;
                    const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                    if (c) return `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
                    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(this.getNavQuery(spot))}`;
                },
                escapeHtml(str) {
                    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                },

                // --- 日本行程：繁體字轉日文漢字（豐島區 → 豊島区），搜尋才找得到 ---
                isJapanTrip() {
                    return false;   // 台灣版不需要轉成日文漢字
                },
                toJapaneseKanji(text) {
                    if (!text || !this.isJapanTrip()) return text || '';
                    const map = { '區':'区','豐':'豊','澀':'渋','濱':'浜','驛':'駅','櫻':'桜','淺':'浅','廣':'広','縣':'県','惠':'恵','參':'参','澤':'沢','邊':'辺','關':'関','齋':'斎','條':'条','會':'会','國':'国','萬':'万','寶':'宝','燒':'焼','黑':'黒','圓':'円','鐵':'鉄','藥':'薬','實':'実','發':'発','樂':'楽','橫':'横','鄉':'郷','壽':'寿','戶':'戸','臺':'台','舊':'旧','德':'徳','龜':'亀','晝':'昼','價':'価','賣':'売','專':'専','點':'点','樓':'楼','灣':'湾','廳':'庁','號':'号','莊':'荘','屆':'届','雙':'双','團':'団','淨':'浄','靜':'静','稻':'稲','藏':'蔵','瀧':'滝','鹽':'塩','禮':'礼','齒':'歯','醫':'医','總':'総','聽':'聴','麵':'麺','燈':'灯','劍':'剣','溫':'温' };
                    return String(text).replace(/[\u3400-\u9fff]/g, ch => map[ch] || ch);
                },

                // --- Map Functionality ---
                loadScriptOnce(src, timeoutMs) {
                    window.__loadedScripts = window.__loadedScripts || {};
                    if (window.__loadedScripts[src]) return window.__loadedScripts[src];
                    const p = new Promise((resolve, reject) => {
                        const sc = document.createElement('script');
                        sc.src = src; sc.async = true;
                        const t = setTimeout(() => reject(new Error('timeout')), timeoutMs || 8000);
                        sc.onload = () => { clearTimeout(t); resolve(); };
                        sc.onerror = () => { clearTimeout(t); reject(new Error('load failed')); };
                        document.head.appendChild(sc);
                    });
                    window.__loadedScripts[src] = p;
                    return p;
                },
                // 底圖：優先用 OpenFreeMap 的向量地圖（色彩接近 Google 地圖，免金鑰），
                // 載不到（網路、手機不支援 WebGL）就自動改用一般圖磚
                setupMapTiles(map) {
                    const useRaster = () => {
                        if (map.__rasterUsed) return;
                        map.__rasterUsed = true;
                        const providers = [
                            () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
                            () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' })
                        ];
                        let idx = 0, errors = 0, loaded = 0, current = null;
                        const use = (i) => {
                            if (current) map.removeLayer(current);
                            errors = 0; loaded = 0;
                            current = providers[i]();
                            current.on('tileload', () => { loaded++; });
                            current.on('tileerror', () => {
                                errors++;
                                if (loaded === 0 && errors >= 4 && idx < providers.length - 1) { idx++; use(idx); }
                            });
                            current.addTo(map);
                        };
                        use(0);
                    };
                    if (!document.getElementById('maplibre-css')) {
                        const link = document.createElement('link');
                        link.id = 'maplibre-css'; link.rel = 'stylesheet';
                        link.href = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css';
                        document.head.appendChild(link);
                    }
                    this.loadScriptOnce('https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js', 8000)
                        .then(() => this.loadScriptOnce('https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0/leaflet-maplibre-gl.js', 8000))
                        .then(() => {
                            if (!window.maplibregl || !L.maplibreGL || map.__rasterUsed) throw new Error('no maplibre');
                            const gl = L.maplibreGL({
                                style: 'https://tiles.openfreemap.org/styles/liberty',
                                attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; OpenStreetMap'
                            }).addTo(map);
                            let ok = false;
                            const glMap = gl.getMaplibreMap ? gl.getMaplibreMap() : null;
                            if (glMap) {
                                glMap.on('load', () => { ok = true; });
                                glMap.on('error', () => { if (!ok) { try { map.removeLayer(gl); } catch (e) {} useRaster(); } });
                            }
                            setTimeout(() => { if (!ok) { try { map.removeLayer(gl); } catch (e) {} useRaster(); } }, 9000);
                        })
                        .catch(() => useRaster());
                },
                ensureMap() {
                    const el = document.getElementById('itinerary-map');
                    if (!el) return null;
                    if (typeof L === 'undefined') {
                        this.mapError = '地圖元件沒有載入成功，請確認網路連線後重新整理頁面。';
                        return null;
                    }
                    if (_leafletMap && _leafletMap.getContainer() !== el) {
                        try { _leafletMap.remove(); } catch (e) {}
                        _leafletMap = null; _leafletLayer = null;
                    }
                    if (!_leafletMap) {
                        _leafletMap = L.map(el, { zoomControl: false }).setView([23.75, 120.95], 7);
                        L.control.zoom({ position: 'topleft' }).addTo(_leafletMap);
                        this.setupMapTiles(_leafletMap);
                        _leafletLayer = L.layerGroup().addTo(_leafletMap);
                        if (window.ResizeObserver) {
                            if (_leafletResizeObs) _leafletResizeObs.disconnect();
                            _leafletResizeObs = new ResizeObserver(() => { if (_leafletMap) _leafletMap.invalidateSize(); });
                            _leafletResizeObs.observe(el);
                        }
                    }
                    _leafletMap.invalidateSize();
                    return _leafletMap;
                },
                collectMapPoints() {
                    const pts = [];
                    for (let d = 0; d < this.itinerary.length; d++) {
                        if (this.mapFilterDay !== -1 && this.mapFilterDay !== d) continue;
                        const day = this.itinerary[d];
                        let num = 1;
                        (day.spots || []).forEach((spot, s) => {
                            if (spot.type === 'transit') return;
                            if (!spot.location && !spot.googleMapUrl) return;   // 與導航站點一致
                            // Google Maps 欄位有座標 → 永遠以它為準
                            const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                            if (c) { spot.lat = c.lat; spot.lng = c.lng; spot.geoSource = 'url'; }
                            const has = spot.lat && spot.lng;
                            pts.push({ dayIdx: d, spotIdx: s, num: num++, name: spot.name || spot.location, dayLabel: day.label,
                                       color: this.getDayColor(d),
                                       status: has ? (spot.geoSource === 'url' ? 'exact' : 'approx') : 'pending',
                                       lat: has ? Number(spot.lat) : null, lng: has ? Number(spot.lng) : null });
                        });
                    }
                    return pts;
                },
                drawMapPoints(pts, fit) {
                    if (!_leafletMap || !_leafletLayer) return;
                    _leafletLayer.clearLayers();
                    const ready = pts.filter(p => p.lat != null && p.lng != null);
                    const byDay = {};
                    ready.forEach(p => { (byDay[p.dayIdx] = byDay[p.dayIdx] || []).push(p); });
                    Object.keys(byDay).forEach(k => {
                        const dayPts = byDay[k].sort((a, b) => a.num - b.num);
                        if (dayPts.length > 1) L.polyline(dayPts.map(p => [p.lat, p.lng]), { color: inkOn(dayPts[0].color) === '#fff' ? dayPts[0].color : '#0096C7', weight: 3, dashArray: '6, 6', opacity: 0.9 }).addTo(_leafletLayer);
                    });
                    ready.forEach(p => {
                        const approx = p.status === 'approx';
                        const html = approx
                            ? `<div style="background:#fff;width:24px;height:24px;border-radius:50%;color:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:2px dashed ${p.color};box-shadow:0 2px 4px rgba(0,0,0,.25);font-family:sans-serif;">${p.num}</div>`
                            : `<div style="background:${p.color};width:24px;height:24px;border-radius:50%;color:${inkOn(p.color)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3);font-family:sans-serif;">${p.num}</div>`;
                        L.marker([p.lat, p.lng], { icon: L.divIcon({ html, className: 'leaflet-custom-marker', iconSize: [24, 24], iconAnchor: [12, 12] }) })
                         .bindPopup(`<b>${this.escapeHtml(p.dayLabel)}</b><br>${this.escapeHtml(p.name)}${approx ? '<br><span style="color:#94a3b8;font-size:11px;">推測位置，可能不準</span>' : ''}`)
                         .addTo(_leafletLayer);
                    });
                    if (fit && ready.length > 0) {
                        _leafletMap.invalidateSize();
                        if (ready.length === 1) _leafletMap.setView([ready[0].lat, ready[0].lng], 15, { animate: false });
                        else _leafletMap.fitBounds(L.latLngBounds(ready.map(p => [p.lat, p.lng])), { padding: [30, 30], maxZoom: 15, animate: false });
                    }
                },
                buildGeoQueries(spot) {
                    const J = (t) => this.toJapaneseKanji(t);
                    const name = (spot.name || '').trim();
                    const loc = (spot.location || '').trim();
                    const share = this.extractShareText(spot.googleMapUrl);
                    const place = this.parsePlaceNameFromUrl(spot.googleMapUrl);
                    const city = (this.tripInfo.destination || '').trim();
                    const list = [];
                    const add = (q) => { q = (q || '').trim(); if (q && !list.includes(q)) list.push(q); };
                    // 由精準到粗略
                    if (share) { add(share); const addr = share.match(/〒?\s*\d{3}-?\d{4}.*$/); if (addr) add(addr[0]); }
                    if (this.looksLikeAddress(loc)) { add(J(loc)); add(loc); }
                    if (place) add(place);
                    if (name && loc && !this.looksLikeAddress(loc)) add(J(`${name} ${loc}`));
                    if (name) add(J(name.includes(city) ? name : `${name} ${city}`));
                    return list.slice(0, 5);
                },
                distanceKm(a, b) {
                    const R = 6371, toR = x => x * Math.PI / 180;
                    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
                    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
                    return 2 * R * Math.asin(Math.sqrt(h));
                },
                async nominatim(q) {
                    try {
                        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&accept-language=zh-TW,en&q=${encodeURIComponent(q)}`);
                        if (!r.ok) return null;
                        const d = await r.json();
                        return d && d.length ? { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) } : null;
                    } catch (e) { return null; }
                },
                async getCityCenter() {
                    const key = '__city__' + (this.tripInfo.destination || '') + '|' + (this.tripInfo.country || '');
                    if (_geoCache[key] !== undefined) return _geoCache[key];
                    const q = (this.tripInfo.destinationEN || this.tripInfo.destination || '') + (this.tripInfo.destinationEN ? ', Taiwan' : ' 台灣');
                    const c = q ? await this.nominatim(q) : null;
                    _geoCache[key] = c;
                    return c;
                },
                // 只在台灣範圍內搜尋，而且離旅遊地點 90 公里內才採用（避免亂標到別的地方）
                async geocodeOne(q, center) {
                    const key = q + '|' + (center ? center.lat.toFixed(2) + ',' + center.lng.toFixed(2) : '');
                    if (_geoCache[key] !== undefined) return _geoCache[key];
                    let result = await this.nominatim(q);
                    if (result && center && this.distanceKm(result, center) > 90) result = null;
                    _geoCache[key] = result;
                    return result;
                },
                async renderMap() {
                    const token = ++_mapRenderToken;
                    this.mapError = ''; this.mapFailedSpots = []; this.mapProgress = ''; this.mapEmpty = false;
                    let map;

                    const city = (this.tripInfo.destination || '').trim();
                    // 3) 完整地址
                    if (this.looksLikeAddress(loc)) return J(placeName ? `${placeName} ${loc}` : `${name} ${loc}`);

                parseFeatureIdFromUrl(url) {

                // 每一站在路線網址中的寫法：
                // 有地點 ID → 路徑放店名、資料區放地點 ID＋座標，Google 會直接鎖定「那一家店」

                getNavStop(spot) {

                        return { seg: placeName || spot.name || `${c.lat},${c.lng}`, block: `!1m5!1m1!1s${fid}!2m2!1d${c.lng}!2d${c.lat}`, size: 6 };

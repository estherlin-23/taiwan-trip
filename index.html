                    const files = event.target.files; if (!files || files.length === 0) return;
                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                                if (width > 900) { height = Math.round((height * 900) / width); width = 900; }
                                canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                                const compressedData = canvas.toDataURL('image/jpeg', 0.7);   // 約 80～150KB，同步也省空間
                                const pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                                if (!Array.isArray(this.selectedSpot.images)) this.selectedSpot.images = [];
                                this.selectedSpot.images.push({ url: compressedData, pos: 50, desc: '', pid });
                                if(!this.selectedSpot.coverImage) {
                                    this.selectedSpot.coverImage = compressedData;
                                    this.selectedSpot.coverPosition = 50;
                                    this.selectedSpot.coverPid = pid;
                                }
                            }; img.src = e.target.result;
                        }; reader.readAsDataURL(file);
                    });
                },
                removeImage(idx) {
                    const removedUrl = this.selectedSpot.images[idx].url || this.selectedSpot.images[idx];
                    this.selectedSpot.images.splice(idx, 1);
                    if(this.selectedSpot.coverImage === removedUrl) {
                        if(this.selectedSpot.images.length > 0) {
                            this.selectedSpot.coverImage = this.selectedSpot.images[0].url || this.selectedSpot.images[0];
                            this.selectedSpot.coverPosition = this.selectedSpot.images[0].pos || 50;
                        } else {
                            this.selectedSpot.coverImage = '';
                        }
                    }
                },
                
                // --- PDF File Upload Logic ---
                handleFileUpload(event) {
                    const files = event.target.files; 
                    if (!files || files.length === 0) return;
                    
                    if(!this.selectedSpot.files) this.selectedSpot.files = [];
                    
                    Array.from(files).forEach(file => {
                        if(file.size > 5 * 1024 * 1024) {
                            alert(`檔案 ${file.name} 超過 5MB，可能會導致系統變慢，建議減少上傳大檔案喔！`);
                        }
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.selectedSpot.files.push({ name: file.name, url: e.target.result });
                        };
                        reader.readAsDataURL(file);
                    });
                },
                removeFile(idx) {
                    this.selectedSpot.files.splice(idx, 1);
                },

                // --- Todo Helpers ---
                getAutoIcon(name) {
                    if (/伴手禮|禮物|買/.test(name)) return 'fas fa-gift';
                    if (/3[Cc]|電子|相機/.test(name)) return 'fas fa-laptop';
                    if (/衣|服/.test(name)) return 'fas fa-shirt';
                    if (/藥|妝/.test(name)) return 'fas fa-pills';
                    return 'fas fa-list';
                },
                openIconPicker(catIndex, subIndex = -1) { 
                    this.editingIconCategoryIndex = catIndex; 
                    this.activeTodoSubcategoryIndex = subIndex;
                    this.showIconPickerModal = true; 
                },
                selectIcon(ic) {
                    if (this.editingIconCategoryIndex === -1) {
                        this.newCategoryIcon = ic;
                    } else if (this.activeTodoSubcategoryIndex !== -1) {
                        this.todoCategories[this.editingIconCategoryIndex].subcategories[this.activeTodoSubcategoryIndex].icon = ic;
                    } else {
                        this.todoCategories[this.editingIconCategoryIndex].icon = ic;
                    }
                    this.showIconPickerModal = false;
                },
                addTodoCategory() {
                    if (this.newCategoryName.trim()) {
                        let ic = this.newCategoryIcon === 'fas fa-folder' ? this.getAutoIcon(this.newCategoryName) : this.newCategoryIcon; 
                        this.todoCategories.push({ id: Date.now(), name: this.newCategoryName.trim(), icon: ic, collapsed: false,
                            subcategories: [{ id: Date.now() + 1, name: '項目', icon: 'fas fa-list', newItemText: '', items: [] }] });
                        this.$nextTick(() => { this.initSortableTodo(); });
                        this.newCategoryName = ''; this.newCategoryIcon = 'fas fa-folder';
                        this.showAddCategoryModal = false;
                    }
                },
                removeTodoCategory(i) { if(confirm('刪除整個大類別？')) this.todoCategories.splice(i, 1); },
                showAddSubcategoryModal(cIdx) {
                    this.activeTodoCategoryIndex = cIdx;
                    this.newSubcategoryName = '';
                    this.showSubcategoryModal = true;
                },
                addSubcategory() {
                    if (this.newSubcategoryName.trim() && this.activeTodoCategoryIndex !== -1) {
                        if(!this.todoCategories[this.activeTodoCategoryIndex].subcategories) {
                            this.todoCategories[this.activeTodoCategoryIndex].subcategories = [];
                        }
                        this.todoCategories[this.activeTodoCategoryIndex].subcategories.push({
                            id: Date.now(), name: this.newSubcategoryName.trim(), icon: 'fas fa-list', newItemText: '', items: []
                        });
                        this.showSubcategoryModal = false;
                        this.$nextTick(() => { this.initSortableTodo(); });
                    }
                },
                removeSubcategory(cIdx, sIdx) {
                    if(confirm('刪除此子類別？')) {
                        this.todoCategories[cIdx].subcategories.splice(sIdx, 1);
                    }
                },
                catProgress(cat) {
                    let done = 0, total = 0;
                    (cat.subcategories || []).forEach(s => (s.items || []).forEach(i => { total++; if (i.done) done++; }));
                    return { done, total };
                },
                addTodoItem(cIdx, sIdx) {
                    let sub = this.todoCategories[cIdx].subcategories[sIdx];
                    if (!sub.items) sub.items = [];
                    if ((sub.newItemText || '').trim()) {
                        sub.items.push({ id: Date.now() + Math.random(), text: sub.newItemText.trim(), done: false });
                        sub.newItemText = '';
                        this.$nextTick(() => { this.initSortableTodo(); });
                    }
                },
                removeTodoItem(cIdx, sIdx, iIdx) { 
                    this.todoCategories[cIdx].subcategories[sIdx].items.splice(iIdx, 1); 
                },

                // --- Setup Generation ---
                generateItinerary() {
                    const start = this.parseYMD(this.tripInfo.startDate);
                    const end = this.parseYMD(this.tripInfo.endDate);
                    const weekDaysEN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                    let current = new Date(start);
                    let dayCount = 1;
                    
                    this.itinerary = [];
                    while (current <= end) {
                        const m = (current.getMonth() + 1).toString().padStart(2, '0');
                        const d = current.getDate().toString().padStart(2, '0');
                        
                        let dayData = {
                            label: `Day ${dayCount}`, dayNum: d, dayOfWeekEN: weekDaysEN[current.getDay()], 
                            shortDate: `${m}/${d}`, rawDate: this.toYMD(current), customSorted: false,
                            hero: { image: '', title: '探索' + this.tripInfo.destination, location: this.tripInfo.destination, position: 50 },
                            spots: []
                        };
                        
                        this.itinerary.push(dayData);
                        current.setDate(current.getDate() + 1);
                        dayCount++;
                    }
                    this.ensureSpotIds();

                    // 預設待辦清單
                    const n = Date.now();
                    this.todoCategories = [
                        {
                            id: n, name: '出門前', icon: 'fas fa-suitcase', collapsed: false,
                            subcategories: [
                                { id: n + 1, name: '隨身物品', icon: 'fas fa-list', newItemText: '',
                                  items: [ { id: n + 11, text: '悠遊卡／一卡通', done: false }, { id: n + 12, text: '行動電源與充電線', done: false }, { id: n + 13, text: '雨傘、防曬', done: false } ] },
                                { id: n + 2, name: '預約與確認', icon: 'fas fa-ticket-alt', newItemText: '',
                                  items: [ { id: n + 21, text: '餐廳訂位', done: false }, { id: n + 22, text: '查好交通與停車', done: false } ] }
                            ]
                        }
                    ];
                },

                submitNewDay() {
                    if(!this.newDayData.date || !this.newDayData.label) return alert('請輸入日期與名稱');
                    const d = new Date(this.newDayData.date);
                    const weekDaysEN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                    const m = (d.getMonth() + 1).toString().padStart(2, '0');
                    const day = d.getDate().toString().padStart(2, '0');
                    
                    this.itinerary.push({
                        label: this.newDayData.label, dayNum: day, dayOfWeekEN: weekDaysEN[d.getDay()], shortDate: `${m}/${day}`, rawDate: this.newDayData.date, customSorted: false,
                        hero: { image: '', title: '自由活動', location: this.tripInfo.destination, position: 50 }, spots: []
                    });
                    this.itinerary.sort((a, b) => new Date(a.rawDate) - new Date(b.rawDate));
                    this.showAddDayModal = false; this.newDayData = { date: '', label: '' };
                },

                copyToMarkdown() {
                    let md = `# ${this.tripInfo.tripName || '我的旅程'}\n`;
                    md += `> 📍 **目的地**: ${this.tripInfo.destination}, ${this.englishDestination}\n`;
                    md += `> 📅 **日期**: ${this.tripInfo.startDate} - ${this.tripInfo.endDate} (${this.calculatedDays}天${this.calculatedNights}夜)\n\n`;
                    
                    md += `---\n\n## 🗺️ 每日行程表\n\n`;
                    this.itinerary.forEach(day => {
                        md += `### ${day.label} (${day.shortDate})\n`;
                        if(day.hero.location) md += `**重點行程**：${day.hero.title} @ ${day.hero.location}\n\n`;
                        if(day.spots) {
                            day.spots.forEach(spot => {
                                let durStr = this.getDurationDisplay(spot);
                                let timeStr = this.getTimelineMainText(spot);
                                md += `- **${timeStr} | ${spot.name}** [${this.getSpotTypeName(spot.type)}] ${durStr ? '('+durStr+')' : ''}\n`;
                                if(spot.cost) md += `  - 💰 花費：${'NT$'} ${this.formatCurrency(spot.cost)} (由 ${spot.payer} 以 ${spot.paymentMethod} 支付)\n`;
                                if(spot.location) md += `  - 📍 地點：${spot.location}\n`;
                                if(spot.googleMapUrl) md += `  - 🗺️ 導航：${spot.googleMapUrl}\n`;
                                if(spot.warning) md += `  - ⚠️ 注意：${spot.warning}\n`;
                                if(spot.desc) md += `  - 📝 筆記：${spot.desc.replace(/\n/g, ' ')}\n`;
                                if(spot.tags && spot.tags.length) {
                                    (spot.checklist && spot.checklist.length ? spot.checklist.map(c => ({ type: c.kind, text: c.text + (c.done ? ' ✅' : '') })) : spot.tags).forEach(t => md += `  - ${t.type}：${t.text}\n`);
                                }
                                if(spot.links && spot.links.length) {
                                    spot.links.forEach(l => md += `  - 🔗 [${l.title}](${l.url})\n`);
                                }
                            });
                        }
                        md += `\n`;
                    });

                    navigator.clipboard.writeText(md).then(() => alert('已成功複製 Markdown！您可以直接貼上至 Notion 了！')).catch(() => alert('複製失敗，請稍後再試。'));
                },
                
                // --- 備份檔：電腦 ↔ 手機搬移 ---
                fileStamp() {
                    const d = new Date();
                    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
                },
                downloadJSON(obj, filename) {
                    const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 3000);
                },
                async exportTripBackup(t) {
                    let data, name;
                    if (t && t.id) { this.tripMenu = null; data = await loadFromDB('trip:' + t.id); name = t.tripName; }
                    else { data = this.tripDataSnapshot(); name = this.tripInfo.tripName; }
                    if (!data) return alert('讀不到這趟旅程的資料');
                    this.downloadJSON(Object.assign({ app: 'tw-trip', backupVersion: 1, exportedAt: new Date().toISOString(), global: this.globalSnapshot() }, data), `${name || '旅程'}_備份_${this.fileStamp()}.json`);
                },
                async exportAllBackup() {
                    await this.flushSave();
                    const trips = [];
                    for (const t of this.sortedTrips) { const d = await loadFromDB('trip:' + t.id); if (d) trips.push(d); }
                    if (!trips.length) return alert('目前還沒有任何旅程可以備份');
                    this.downloadJSON({ app: 'tw-trip-all', backupVersion: 1, exportedAt: new Date().toISOString(), global: this.globalSnapshot(), trips }, `台灣旅行手帳_全部備份_${this.fileStamp()}.json`);
                },
                // 匯入：一趟或全部備份都可以，一律「新增」到一覽表，不會蓋掉現有的旅程
                importBackupJSON(event) {
                    const file = event.target.files && event.target.files[0];
                    event.target.value = '';
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        let data;
                        try { data = JSON.parse(e.target.result); } catch (err) { return alert('這個檔案不是行程備份檔，請確認選的是「_備份_」開頭的 .json 檔。'); }
                        let list = [];
                        if (data && Array.isArray(data.trips)) list = data.trips;
                        else if (data && Array.isArray(data.itinerary) && data.tripInfo) list = [data];
                        list = list.filter(x => x && Array.isArray(x.itinerary) && x.tripInfo);
                        if (!list.length) return alert('這個檔案不是行程備份檔，請確認選的是「_備份_」開頭的 .json 檔。');
                        // 同行者、付款方式、花費類別：合併，不覆蓋
                        const g = data.global || data;
                        const union = (a, b) => (a || []).concat((b || []).filter(x => !(a || []).includes(x)));
                        this.customPayers = union(this.customPayers, g.customPayers);
                        this.customPaymentMethods = union(this.customPaymentMethods, g.customPaymentMethods);
                        this.customTransits = union(this.customTransits, g.customTransits);
                        (g.costCategoryList || []).forEach(c => { if (c && c.name && !this.costCategoryList.some(x => x.name === c.name)) this.costCategoryList.push({ name: c.name, emoji: c.emoji }); });
                        const names = [];
                        let lastId = '';
                        for (const item of list) {
                            const copy = { tripInfo: item.tripInfo, itinerary: item.itinerary, todoCategories: item.todoCategories || [], isGenerated: true };
                            const id = makeTripId();
                            await saveToDB('trip:' + id, JSON.parse(JSON.stringify(copy)));
                            this.upsertTripSummary(this.tripSummaryOf(id, copy));
                            names.push(copy.tripInfo.tripName || copy.tripInfo.destination || '旅程');
                            lastId = id;
                        }
                        await this.saveIndex();
                        await saveToDB('global', this.globalSnapshot());
                        if (list.length === 1 && this.appState === 'home') { if (await this.openTrip(lastId)) this.showToast(`已匯入「${names[0]}」`); }
                        else alert(list.length === 1 ? `已匯入「${names[0]}」，可以在旅程一覽找到。` : `已匯入 ${list.length} 趟旅程！`);
                    };
                    reader.readAsText(file);
                },

                exportToHTML() {
                    const stateSnapshot = Object.assign(this.tripDataSnapshot(), { global: this.globalSnapshot() });
                    const stateJSON = JSON.stringify(stateSnapshot);
                    
                    let appTemplateHtml = document.getElementById('app-template').innerHTML;
                    const extraTpl = ['date-field-tpl'].map(id => `<template id="${id}">${document.getElementById(id).innerHTML}</template>`).join('\n');
                    let scriptHtml = document.getElementById('main-script').innerHTML;
                    let headHtml = document.head.innerHTML.replace(/<script>window\.__PRELOADED_STATE__.*<\/script>/, '');

                    const fullHTML = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    ${headHtml}
    <script>window.__PRELOADED_STATE__ = ${stateJSON};<\/script>
</head>
<body>
    <div id="app"></div>
    <template id="app-template">${appTemplateHtml}</template>
    ${extraTpl}
    <script id="main-script">${scriptHtml}<\/script>
</body>
</html>`;
                    
                    const blob = new Blob(['\ufeff' + fullHTML], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.tripInfo.tripName || '旅行回憶'}_時光膠囊.html`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }
        });
        // ===== 共用元件 =====
        const WEEK_ZH = ['日', '一', '二', '三', '四', '五', '六'];
                const DEFAULT_COST_CATEGORIES = [
            { name: '食物', emoji: '🍔' }, { name: '伴手禮', emoji: '🎁' }, { name: '購物', emoji: '🛍️' },
            { name: '住宿', emoji: '🏨' }, { name: '交通', emoji: '🚆' }, { name: '活動/門票', emoji: '🎫' }
        ];
        // 台灣人常搭的航空公司（下拉選單用，依地區分組）
        const DateField = {
            props: ['modelValue', 'placeholder', 'min', 'max', 'short'],
            emits: ['update:modelValue'],
            template: '#date-field-tpl',
            methods: {
                openPicker(e) { try { if (e.target.showPicker) e.target.showPicker(); } catch (err) {} }
            },
            computed: {
                display() {
                    if (!this.modelValue) return this.placeholder || '選擇日期';
                    const [y, m, d] = this.modelValue.split('-').map(Number);
                    const w = WEEK_ZH[new Date(y, m - 1, d).getDay()];
                    const md = `${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`;
                    return this.short ? `${md} (${w})` : `${y}/${md} (${w})`;
                }
            }
        };
        app.component('date-field', DateField);
        app.mount('#app');
    </script>
</body>
</html>
